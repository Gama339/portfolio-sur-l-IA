<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Horloge Blackout</title>

    <style>
        .blackout-sidebar-time {
            text-align: center;
        }

        .blackout-sidebar-clock-label {
            font-size: 12px;
            letter-spacing: 2px;
        }

        .blackout-sidebar-clock {
            font-family: monospace;
            font-size: 32px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="blackout-sidebar-time">

        <p class="blackout-sidebar-clock-label">
            HEURE LOCALE
        </p>

        <p id="blackout-horloge" class="blackout-sidebar-clock" aria-label="Heure locale">
            --:--:--
        </p>

    </div>

    <script>

        /*
        ==========================================
        HORLOGE EN TEMPS RÉEL
        OPÉRATION BLACKOUT
        ==========================================
        */

        // Récupération de l'élément HTML.
        const horloge = document.getElementById(
            'blackout-horloge'
        );

        /*
        Actualisation de l'heure.
        */

        function actualiserHorlogeBlackout() {

            if (!horloge) {
                return;
            }

            // Récupération de l'heure locale.
            const maintenant = new Date();

            // Affichage au format HH:MM:SS.
            horloge.textContent =
                maintenant.toLocaleTimeString(
                    'fr-FR',
                    {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    }
                );

        }

        /*
        ==========================================
        ACTUALISATION AUTOMATIQUE
        ==========================================
        */

        // Premier affichage immédiat.
        actualiserHorlogeBlackout();

        // Actualisation toutes les secondes.
        setInterval(
            actualiserHorlogeBlackout,
            1000
        );

    </script>

</body>

</html>
